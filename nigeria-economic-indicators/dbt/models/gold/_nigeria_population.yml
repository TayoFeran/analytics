version: 2

models:
  - name: nigeria_population
    description: >
      Nigeria total population, one row per year, sourced from the annual
      silver model filtered to the population indicator.
    columns:
      - name: date
        description: Year start (Jan 1) for the observation.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('nigeria_econ_metric_annual')
                field: make_date(year, 1, 1)
      - name: country_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NGA']
      - name: country_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Nigeria']
      - name: population
        description: Total population, cast to integer.
        data_tests:
          - not_null
      - name: extracted_at
        data_tests:
          - not_null
