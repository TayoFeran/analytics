version: 2

models:
  - name: nigeria_gdp
    description: >
      Nigeria GDP (current US$), one row per year, sourced from the annual
      silver model filtered to the GDP indicator.
    columns:
      - name: date
        description: Year start (Jan 1) for the observation.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('nigeria_econ_metric_annual')
                field: make_date(year, 1, 1)
      - name: country_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NGA']
      - name: country_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Nigeria']
      - name: gdp
        description: GDP in current US dollars.
        data_tests:
          - not_null
      - name: extracted_at
        description: Date of the extract run that produced the row.
        data_tests:
          - not_null
