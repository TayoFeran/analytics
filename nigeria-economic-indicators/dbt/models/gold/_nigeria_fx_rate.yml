version: 2

models:
  - name: nigeria_fx_rate
    description: >
      Nigeria official exchange rate (NGN per US$), one row per month, sourced
      from the monthly silver model filtered to the exchange rate indicator.
    columns:
      - name: date
        description: Month start for the observation.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('nigeria_econ_metric_monthly')
                field: make_date(year, month, 1)
      - name: country_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NGA']
      - name: country_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Nigeria']
      - name: exchange_rate
        description: Local currency units per US dollar, rounded to whole units.
        data_tests:
          - not_null
      - name: extracted_at
        data_tests:
          - not_null
