version: 2

sources:
  - name: world_bank
    description: >
      Raw World Bank indicator extracts for Nigeria, loaded by the World Bank pipeline
      (currently nigeria-economic-indicators/extract.py).
    # Same database as the target, so dev builds read dev_dwh.bronze and prod builds
    # read prod_dwh.bronze
    database: "{{ target.database }}"
    schema: bronze
    tables:
      - name: nigeria_econ_metric_annual
        description: Annual indicators (GDP, population). One row per indicator per year.
      - name: nigeria_econ_metric_monthly
        description: Monthly indicators (FX rate, CPI). One row per indicator per month.
