version: 2

seeds:
  - name: nigeria_administration
    description: >
      Nigerian presidential administrations, for comparing FAAC allocations by
      administration. Jonathan is listed ahead of any data from his term, so pre-2020
      workbooks can be added without changing this list.
    config:
      column_types:
        term_start: date
        term_end: date
        first_disbursement_month: date
    columns:
      - name: president
        description: Short name, matching the president column of the FAAC tables.
        data_tests:
          - not_null
          - unique
      - name: full_name
        data_tests:
          - not_null
      - name: party
        data_tests:
          - not_null
      - name: term_start
        description: Inauguration date.
        data_tests:
          - not_null
      - name: term_end
        description: End of term. Blank for the administration in office.
      - name: first_disbursement_month
        description: >
          First FAAC month attributed to this administration. Presidents are inaugurated on
          29 May, so the whole of May goes to the incoming administration (the same rule as
          the president column in nigeria_faac_income and nigeria_faac_deduction).
        data_tests:
          - not_null
          - unique
